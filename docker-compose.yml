services:
  ride-generator:
    build: .
    image: ride-generator-service:0.1.0
    container_name: ride-generator-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:${RIDE_PORT:-3007}:3007"
    env_file:
      - .env
    # Corre con el usuario del equipo para que las copias de los RIDE queden a
    # su nombre y las pueda abrir y borrar.
    user: "${RIDE_UID:-1000}:${RIDE_GID:-1000}"
    environment:
      HOME: /tmp
      RIDE_PDF_FOLDER: /rides
    volumes:
      - ${RIDE_FOLDER_HOST:-./rides-generados}:/rides
    networks: [pac-invoicing-v2]
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3007/salud').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

# La red la crea Infrastructure/docker-compose.yml: levantar eso primero.
networks:
  pac-invoicing-v2:
    external: true
